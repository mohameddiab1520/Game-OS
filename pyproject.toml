[project]
name = "gameos-ai"
version = "1.0.0"
description = "Open-source Unity AI assistant with orchestrator mode and asset generation"
authors = [
    {name = "GameOS AI Team", email = "support@gameos.ai"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["unity", "ai", "game-development", "mcp", "orchestrator", "asset-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "fastmcp>=0.2.0",
    "mcp>=1.1.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "aiofiles>=23.2.1",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "google-generativeai>=0.8.3",
    "groq>=0.11.0",
    "replicate>=0.32.1",
    "pillow>=10.4.0",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "markdown>=3.7",
    "python-frontmatter>=1.1.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.2",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/Game-OS"
Documentation = "https://github.com/YOUR_USERNAME/Game-OS/docs"
Repository = "https://github.com/YOUR_USERNAME/Game-OS"
"Bug Tracker" = "https://github.com/YOUR_USERNAME/Game-OS/issues"

[project.scripts]
gameos = "ai_game_dev.core.cli:app"
gameos-server = "ai_game_dev.core.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_game_dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=ai_game_dev --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
